<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paced browser pairing</title>
    <style>
      body {
        font: 14px system-ui;
        color: #1d2433;
        max-width: 560px;
        margin: 24px auto;
        padding: 0 16px;
      }
      input {
        font: inherit;
        padding: 6px 8px;
        width: 12ch;
        text-transform: uppercase;
      }
      button {
        font: inherit;
        padding: 6px 12px;
      }
      ul {
        padding-left: 18px;
      }
      p.note {
        color: #4a5568;
      }
    </style>
  </head>
  <body>
    <h1>Paced</h1>
    <p class="note">
      This browser records only what you see on the LinkedIn pages you open
      yourself, and only for people enrolled in your Paced workspace. It never
      opens pages, clicks anything or sends anything to LinkedIn.
    </p>
    <h2>Status</h2>
    <ul id="status" aria-live="polite"></ul>
    <form id="pair">
      <h2>Pair with your workspace</h2>
      <label for="code">Pairing code from Paced (valid for five minutes)</label
      ><br />
      <input
        id="code"
        name="code"
        autocomplete="off"
        required
        pattern="[A-Za-z2-9]{8}"
      />
      <button type="submit">Pair this browser</button>
    </form>
    <button id="unpair" type="button" hidden>Disconnect this browser</button>
    <p id="pair-result" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
